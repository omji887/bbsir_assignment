<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Digital Communication Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .math-font { font-family: 'Roboto Mono', monospace; }
        .input-group input, .input-group select {
            transition: all 0.2s ease-in-out;
        }
        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8 flex items-center justify-center">

    <div class="max-w-5xl w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        
        <!-- Header -->
        <div class="bg-blue-900 text-white p-6 md:p-8 text-center border-b-4 border-blue-500">
            <h1 class="text-2xl md:text-3xl font-bold mb-2 tracking-tight">Digital Communication Link Calculator</h1>
            <p class="text-blue-200 text-sm md:text-base">Academic utility for evaluating Sampling, Quantization, and Digital Modulation.</p>
        </div>

        <div class="p-6 md:p-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- Left Column: Input Parameters -->
            <div class="lg:col-span-5 space-y-5">
                <div>
                    <h2 class="text-lg font-semibold text-slate-900 border-b pb-2 mb-4">Known Parameters</h2>
                    <p class="text-sm text-slate-500 mb-4">Adjust the inputs to update calculations in real-time:</p>
                </div>

                <div class="space-y-4">
                    <!-- f_max -->
                    <div class="input-group">
                        <label for="fmax" class="block text-sm font-medium text-slate-700 mb-1">Max Signal Frequency (f<sub>max</sub>)</label>
                        <div class="relative">
                            <input type="number" id="fmax" step="0.1" value="4" class="w-full bg-slate-50 border border-slate-300 text-slate-900 rounded-lg py-2.5 px-4 pr-12 focus:bg-white" placeholder="e.g. 4.0">
                            <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-slate-500 font-medium text-sm">kHz</div>
                        </div>
                    </div>

                    <!-- n (bits) -->
                    <div class="input-group">
                        <label for="n" class="block text-sm font-medium text-slate-700 mb-1">Bits per Sample (n)</label>
                        <div class="relative">
                            <input type="number" id="n" step="1" value="8" class="w-full bg-slate-50 border border-slate-300 text-slate-900 rounded-lg py-2.5 px-4 pr-12 focus:bg-white" placeholder="e.g. 8">
                            <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-slate-500 font-medium text-sm">bits</div>
                        </div>
                    </div>

                    <!-- V_max -->
                    <div class="input-group">
                        <label for="vmax" class="block text-sm font-medium text-slate-700 mb-1">Maximum Voltage (V<sub>max</sub>)</label>
                        <div class="relative">
                            <input type="number" id="vmax" step="0.5" value="5" class="w-full bg-slate-50 border border-slate-300 text-slate-900 rounded-lg py-2.5 px-4 pr-12 focus:bg-white" placeholder="e.g. 5.0">
                            <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-slate-500 font-medium text-sm">V</div>
                        </div>
                    </div>

                    <!-- V_min -->
                    <div class="input-group">
                        <label for="vmin" class="block text-sm font-medium text-slate-700 mb-1">Minimum Voltage (V<sub>min</sub>)</label>
                        <div class="relative">
                            <input type="number" id="vmin" step="0.5" value="-5" class="w-full bg-slate-50 border border-slate-300 text-slate-900 rounded-lg py-2.5 px-4 pr-12 focus:bg-white" placeholder="e.g. -5.0">
                            <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-slate-500 font-medium text-sm">V</div>
                        </div>
                    </div>

                    <!-- Modulation Scheme -->
                    <div class="input-group">
                        <label for="modScheme" class="block text-sm font-medium text-slate-700 mb-1">Digital Modulation Scheme</label>
                        <select id="modScheme" class="w-full bg-slate-50 border border-slate-300 text-slate-900 rounded-lg py-2.5 px-4 focus:bg-white">
                            <option value="BPSK" selected>BPSK (Binary Phase Shift Keying)</option>
                            <option value="ASK">ASK (Amplitude Shift Keying)</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Right Column: Mathematical Output -->
            <div class="lg:col-span-7 flex flex-col h-full">
                <div>
                    <h2 class="text-lg font-semibold text-slate-900 border-b pb-2 mb-4 flex justify-between items-center">
                        <span>Calculation Board</span>
                        <button onclick="copyResults()" class="text-sm text-blue-600 hover:text-blue-800 font-medium px-3 py-1.5 rounded-md bg-blue-50 hover:bg-blue-100 transition shadow-sm border border-blue-200" title="Copy to clipboard">
                            Copy for Word Doc
                        </button>
                    </h2>
                </div>
                
                <div id="error-box" class="hidden mb-4 bg-red-50 border-l-4 border-red-500 p-4 rounded-r text-red-700 text-sm">
                    Please ensure inputs are valid and V<sub>max</sub> is strictly greater than V<sub>min</sub>.
                </div>

                <!-- Results Display Area -->
                <div id="results-box" class="flex-grow bg-[#f8fafc] border border-slate-200 rounded-xl p-5 md:p-6 shadow-inner math-font text-sm leading-relaxed text-slate-700 overflow-y-auto max-h-[600px]">
                    <!-- Dynamic content injected here -->
                </div>
            </div>

        </div>
    </div>

    <script>
        function formatNum(num) {
            return Number.isInteger(num) ? num.toString() : num.toFixed(3).replace(/\.?0+$/, '');
        }

        function calculateDigitalMetrics() {
            // Retrieve inputs
            const fmax = parseFloat(document.getElementById('fmax').value);
            const n = parseInt(document.getElementById('n').value);
            const vmax = parseFloat(document.getElementById('vmax').value);
            const vmin = parseFloat(document.getElementById('vmin').value);
            const scheme = document.getElementById('modScheme').value;
            
            const errorBox = document.getElementById('error-box');
            const resultsBox = document.getElementById('results-box');

            // Validation
            if (isNaN(fmax) || isNaN(n) || isNaN(vmax) || isNaN(vmin) || fmax <= 0 || n <= 0 || vmax <= vmin) {
                errorBox.classList.remove('hidden');
                resultsBox.innerHTML = '';
                return;
            }
            errorBox.classList.add('hidden');

            // Calculations
            const fs = 2 * fmax;                     // Nyquist rate in kHz
            const L = Math.pow(2, n);                // Quantization Levels
            const delta = (vmax - vmin) / L;         // Step size in Volts
            const qe = delta / 2;                    // Max Quantization Error in Volts
            const rb = n * fs;                       // Bit rate in kbps
            
            let bw, bwFormula, bwCalc;
            if (scheme === 'BPSK') {
                bw = rb;                             // Bandwidth in kHz
                bwFormula = `BW<sub>BPSK</sub> = R<sub>b</sub>`;
                bwCalc = `BW = ${formatNum(rb)}`;
            } else {
                bw = 2 * rb;                         // Bandwidth in kHz
                bwFormula = `BW<sub>ASK</sub> = 2 &times; R<sub>b</sub>`;
                bwCalc = `BW = 2 &times; ${formatNum(rb)}`;
            }

            // Constructing the HTML output with clean mathematical formatting
            const htmlOutput = `
<div class="space-y-5">
    <!-- Step 1 -->
    <div>
        <div class="font-bold text-blue-900 mb-1 font-sans">1. Nyquist Sampling Rate (f<sub>s</sub>)</div>
        <div class="pl-4 border-l-2 border-blue-300 space-y-1">
            <div class="text-slate-500">Formula: f<sub>s</sub> = 2 &times; f<sub>max</sub></div>
            <div class="text-slate-800">f<sub>s</sub> = 2 &times; ${formatNum(fmax)}</div>
            <div class="font-bold text-black">f<sub>s</sub> = ${formatNum(fs)} kHz</div>
        </div>
    </div>

    <!-- Step 2 -->
    <div>
        <div class="font-bold text-blue-900 mb-1 font-sans">2. Quantization Levels (L)</div>
        <div class="pl-4 border-l-2 border-blue-300 space-y-1">
            <div class="text-slate-500">Formula: L = 2<sup>n</sup></div>
            <div class="text-slate-800">L = 2<sup>${n}</sup></div>
            <div class="font-bold text-black">L = ${formatNum(L)} levels</div>
        </div>
    </div>

    <!-- Step 3 -->
    <div>
        <div class="font-bold text-blue-900 mb-1 font-sans">3. Quantization Step Size (&Delta;)</div>
        <div class="pl-4 border-l-2 border-blue-300 space-y-1">
            <div class="text-slate-500">Formula: &Delta; = (V<sub>max</sub> - V<sub>min</sub>) / L</div>
            <div class="text-slate-800">&Delta; = (${formatNum(vmax)} - (${formatNum(vmin)})) / ${formatNum(L)}</div>
            <div class="text-slate-800">&Delta; = ${formatNum(vmax - vmin)} / ${formatNum(L)}</div>
            <div class="font-bold text-black">&Delta; = ${formatNum(delta)} V</div>
        </div>
    </div>

    <!-- Step 4 -->
    <div>
        <div class="font-bold text-blue-900 mb-1 font-sans">4. Max Quantization Error (Q<sub>e</sub>)</div>
        <div class="pl-4 border-l-2 border-blue-300 space-y-1">
            <div class="text-slate-500">Formula: Q<sub>e</sub> = &plusmn; (&Delta; / 2)</div>
            <div class="text-slate-800">Q<sub>e</sub> = ${formatNum(delta)} / 2</div>
            <div class="font-bold text-black">Q<sub>e</sub> = &plusmn; ${formatNum(qe)} V</div>
        </div>
    </div>

    <!-- Step 5 -->
    <div>
        <div class="font-bold text-blue-900 mb-1 font-sans">5. Total Bit Rate (R<sub>b</sub>)</div>
        <div class="pl-4 border-l-2 border-blue-300 space-y-1">
            <div class="text-slate-500">Formula: R<sub>b</sub> = n &times; f<sub>s</sub></div>
            <div class="text-slate-800">R<sub>b</sub> = ${n} &times; ${formatNum(fs)}</div>
            <div class="font-bold text-black">R<sub>b</sub> = ${formatNum(rb)} kbps</div>
        </div>
    </div>

    <!-- Step 6 -->
    <div>
        <div class="font-bold text-blue-900 mb-1 font-sans">6. Transmission Bandwidth (BW)</div>
        <div class="pl-4 border-l-2 border-blue-300 space-y-1">
            <div class="text-slate-500">Formula: ${bwFormula}</div>
            <div class="text-slate-800">${bwCalc}</div>
            <div class="font-bold text-black">BW = ${formatNum(bw)} kHz</div>
            <div class="text-xs text-slate-500 mt-1 italic">[Based on ${scheme} Modulation Scheme]</div>
        </div>
    </div>
</div>`;

            resultsBox.innerHTML = htmlOutput;
        }

        // Copy plain text logic for pasting into Word docs
        function copyResults() {
            const resultsBox = document.getElementById('results-box');
            if(!resultsBox.innerHTML.trim()) {
                alert("Please ensure inputs are valid to generate results.");
                return;
            }

            const fmax = parseFloat(document.getElementById('fmax').value);
            const n = parseInt(document.getElementById('n').value);
            const vmax = parseFloat(document.getElementById('vmax').value);
            const vmin = parseFloat(document.getElementById('vmin').value);
            const scheme = document.getElementById('modScheme').value;
            
            const fs = 2 * fmax;
            const L = Math.pow(2, n);
            const delta = (vmax - vmin) / L;
            const qe = delta / 2;
            const rb = n * fs;
            const bw = scheme === 'BPSK' ? rb : 2 * rb;

            const textToCopy = 
`1. Nyquist Sampling Rate (fs)
Formula: fs = 2 * fmax
Calculation: fs = 2 * ${fmax} = ${fs} kHz

2. Quantization Levels (L)
Formula: L = 2^n
Calculation: L = 2^${n} = ${L} levels

3. Quantization Step Size (Delta)
Formula: Delta = (Vmax - Vmin) / L
Calculation: Delta = (${vmax} - (${vmin})) / ${L} = ${formatNum(delta)} V

4. Max Quantization Error (Qe)
Formula: Qe = ±(Delta / 2)
Calculation: Qe = ±(${formatNum(delta)} / 2) = ±${formatNum(qe)} V

5. Total Bit Rate (Rb)
Formula: Rb = n * fs
Calculation: Rb = ${n} * ${fs} = ${rb} kbps

6. Transmission Bandwidth (BW) [${scheme}]
Formula: BW = ${scheme === 'BPSK' ? 'Rb' : '2 * Rb'}
Calculation: BW = ${scheme === 'BPSK' ? rb : `2 * ${rb}`} = ${bw} kHz`;

            const dummy = document.createElement("textarea");
            document.body.appendChild(dummy);
            dummy.value = textToCopy;
            dummy.select();
            document.execCommand("copy");
            document.body.removeChild(dummy);

            // Visual feedback on the button
            const btn = document.querySelector('button[onclick="copyResults()"]');
            const originalText = btn.innerText;
            btn.innerText = "Copied to Clipboard!";
            btn.classList.add('bg-green-100', 'text-green-800', 'border-green-300');
            btn.classList.remove('bg-blue-50', 'text-blue-600', 'border-blue-200');
            setTimeout(() => {
                btn.innerText = originalText;
                btn.classList.remove('bg-green-100', 'text-green-800', 'border-green-300');
                btn.classList.add('bg-blue-50', 'text-blue-600', 'border-blue-200');
            }, 2000);
        }

        // Add event listeners to all inputs to trigger calculation instantly on change/type
        document.querySelectorAll('input, select').forEach(input => {
            input.addEventListener('input', calculateDigitalMetrics);
        });

        // Initialize with default calculations on page load
        document.addEventListener('DOMContentLoaded', calculateDigitalMetrics);
    </script>
</body>
</html>
